[package]
name = "fleece"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The Fleece binary format in pure Rust, extended with the value types of SurrealDB"
publish = false

[features]
default = ["json"]
# JSON <-> Fleece conversion.
json = ["dep:serde_json"]
# The types of an application to documents and back, without a `Value` in between.
serde = ["dep:serde"]
# Geometries to and from the types of `geo-types`, which the algorithms of `geo` work on.
geo = ["dep:geo-types"]

[dependencies]
geo-types = { version = "0.7", optional = true }
serde = { version = "1", optional = true }
# float_roundtrip: a float read from JSON text is the float that was written.
serde_json = { version = "1", optional = true, features = ["float_roundtrip"] }

[[example]]
name = "fleece"
required-features = ["json"]

# The inputs the fuzz targets of `fuzz/` start from.
[[example]]
name = "fuzz_seeds"
required-features = ["json"]

[[bench]]
name = "throughput"
harness = false
required-features = ["json"]

[dev-dependencies]
proptest = "1"
# The algorithms a converted geometry is given to in the tests.
geo = "0.33"
# The crates SurrealDB holds these types with: the layouts here are checked against them.
geo-types = "0.7"
half = "2"
num-bigint = "0.4"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SurrealDB's own types: the keys of numbers are checked against its ordered encoding.
surrealdb-types = "4"
