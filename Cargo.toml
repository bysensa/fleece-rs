[package]
name = "fleece"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The Fleece binary format in pure Rust, extended with the value types of SurrealDB"
publish = false

[features]
default = ["json"]
# JSON <-> Fleece conversion.
json = ["dep:serde_json"]
# The types of an application to documents and back, without a `Value` in between.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true }
# float_roundtrip: a float read from JSON text is the float that was written.
serde_json = { version = "1", optional = true, features = ["float_roundtrip"] }

[[example]]
name = "fleece"
required-features = ["json"]

[[bench]]
name = "throughput"
harness = false
required-features = ["json"]

[dev-dependencies]
proptest = "1"
# The crates SurrealDB holds these types with: the layouts here are checked against them.
half = "2"
num-bigint = "0.4"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SurrealDB's own types: the keys of numbers are checked against its ordered encoding.
surrealdb-types = "4"
